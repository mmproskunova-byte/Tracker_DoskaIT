<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowBoard — трекер задач команды</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <div class="header-inner">

    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
        <path d="M9 3v18M15 3v18"></path>
      </svg>
      <span>FlowBoard</span>
    </div>

    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path>
      </svg>
      <input id="searchInput" type="search" placeholder="Поиск задач…" autocomplete="off">
    </div>

    <div class="header-actions">
      <div class="pop-wrap">
        <button id="bellBtn" class="icon-btn" type="button" aria-label="Уведомления" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
          </svg>
          <span id="bellBadge" class="badge" hidden>0</span>
        </button>
        <div id="bellPop" class="popover" hidden></div>
      </div>

      <div class="pop-wrap">
        <button id="userBtn" class="user-btn" type="button" aria-expanded="false">
          <span id="userAvatar" class="avatar"></span>
          <span class="user-btn-text">
            <b id="userName"></b>
            <small id="userRole"></small>
          </span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>
        <div id="userPop" class="popover popover-user" hidden></div>
      </div>
    </div>

  </div>
</header>

<main class="container">
  <section id="summary" class="summary" aria-label="Сводка по статусам"></section>

  <div class="toolbar">
    <div class="toolbar-left">
      <h1 class="page-title">Доска задач</h1>
      <p id="roleHint" class="hint"></p>
    </div>
    <button id="newTaskBtn" class="btn btn-primary" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
      Новая задача
    </button>
  </div>

  <div id="board" class="board"></div>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>

<div id="overlay" class="overlay" hidden>
  <div id="dialog" class="dialog" role="dialog" aria-modal="true"></div>
</div>

<script src="app.js"></script>
</body>
</html>
